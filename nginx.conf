# ============================================================
# MANA VIVAHA — nginx config
# ============================================================
# 2 ways use cheyyochu:
#
#  MODE A (RECOMMENDED — server lo already nginx undi):
#     sudo cp nginx.conf /etc/nginx/sites-available/manavivaha
#     sudo ln -sf /etc/nginx/sites-available/manavivaha /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d manavivaha.in -d www.manavivaha.in    # SSL → certbot ee file ki add chestundi
#     (docker-compose nginx service ni start cheyyaku — port conflict avutundi)
#
#  MODE B (docker nginx):
#     docker-compose --profile with-nginx up -d nginx
#     SSL kosam: docker-compose.yml lo nginx volumes ki /etc/letsencrypt mount chesi,
#     443 server block add cheyyali (certbot host lo run chesi, files mount chey).
# ============================================================

worker_processes auto;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25M;          # photo uploads (3 photos auto compress)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    upstream frontend_up { server frontend:3000; }
    upstream backend_up  { server backend:8000;  }

    server {
        listen 80;
        server_name manavivaha.in www.manavivaha.in app.manavivaha.in api.manavivaha.in 140.245.216.16 localhost;

        # ---- Backend API (register, channels, publish, matches...) ----
        location /api/ {
            proxy_pass http://backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ---- Swagger ----
        location /docs         { proxy_pass http://backend_up/docs;         proxy_set_header Host $host; }
        location /openapi.json { proxy_pass http://backend_up/openapi.json; proxy_set_header Host $host; }

        # ---- Member media: backend enforces approval, privacy and owner/admin access ----
        location /cards/ {
            proxy_pass http://backend_up/cards/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /photos/ {
            proxy_pass http://backend_up/photos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- WhatsApp bridge (optional service) ----
        location /wa/ {
            proxy_pass http://whatsapp-bridge:3001/;
            proxy_set_header Host $host;
        }

        # ---- Frontend (Next.js) ----
        location / {
            proxy_pass http://frontend_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location = /health { return 200 "OK\n"; add_header Content-Type text/plain; }
    }
}
